[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasttcl"
version = "0.2.0"
description = "Fast TCL2/TCL4/TCL6 solvers for non-Markovian open quantum systems."
keywords = [
  "open quantum systems",
  "non-Markovian dynamics",
  "quantum dynamics",
  "master equations",
  "time-convolutionless",
  "TCL",
  "TCL2",
  "TCL4",
  "TCL6",
  "spin-boson",
  "numerical methods",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Jiahao Chen"}, {name = "Sirui Chen"}, {name = "Dragomir Davidovic"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.11"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
notebook = ["jupyterlab>=4", "nbclient>=0.8", "nbformat>=5.9", "ipykernel>=6", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/jcarrots/fasttcl"
Issues = "https://github.com/jcarrots/fasttcl/issues"
Paper = "https://arxiv.org/abs/2609.18806"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fasttcl*"]

[tool.setuptools.package-data]
fasttcl = ["data/*.json", "data/*.jsonl", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
